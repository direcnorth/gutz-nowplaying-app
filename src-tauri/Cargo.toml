[package]
name = "gutz-nowplaying-app"
version = "0.1.6"
description = "Desktop-Wrapper für gutz-nowplaying"
authors = ["Gutzkowclub Dresden e.V."]
edition = "2021"

[lib]
name = "gutz_nowplaying_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.0", features = [] }

[dependencies]
# Tauri 3 alpha: Runtime ist ein eigenes Crate, siehe lib.rs `.runtime(...)`.
tauri = { version = "3.0.0-alpha.1", features = ["tray-icon", "image-png"] }
tauri-runtime-wry = "3.0.0-alpha.1"
tauri-plugin-opener = "3.0.0-alpha.0"
tauri-plugin-notification = "3.0.0-alpha.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "3.0.0-alpha.0"
tauri-plugin-single-instance = "3.0.0-alpha.0"
tauri-plugin-updater = "3.0.0-alpha.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
