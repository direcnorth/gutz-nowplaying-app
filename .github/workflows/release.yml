name: Release

# Nur Versions-Tags (v0.1.0, v0.2.0, ...) bauen UND veröffentlichen - der
# normale Build-Check in build.yml läuft weiter separat auf jeden Push/PR,
# ohne dabei ständig neue Releases anzulegen.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          # GITHUB_TOKEN verweigert "create a release" grundlos trotz
          # `permissions: contents: write` (Stand 2026-09-21, ohne dass sich
          # an der Konfiguration etwas geaendert haette - lief fuer v0.1.0/
          # v0.1.1 noch problemlos). RELEASE_TOKEN ist ein persoenlicher
          # Token mit repo-Scope als Workaround, siehe Commit-Message.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Signiert die Updater-Artefakte (latest.json + .sig je Plattform),
          # siehe plugins.updater.pubkey in tauri.conf.json - ohne gueltige
          # Signatur lehnt der Autoupdater das Paket ab.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gutz Now Playing ${{ github.ref_name }}'
          releaseBody: 'Installer für Windows, macOS und Linux. Siehe /downloads auf np.gutz.info für eine sortierte Übersicht.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 ist kaputt (versucht das laengst
      # entfernte SDK-Paket "tools" zu installieren und bricht komplett ab).
      # ubuntu-22.04-Runner haben ohnehin schon ein Android-SDK unter
      # $ANDROID_HOME vorinstalliert - nur NDK fehlt, die holen wir direkt.
      - name: Android-Lizenzen + NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Android-Signing einrichten
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.keystore
          PROPS

      - name: APK bauen (aarch64 - deckt praktisch alle Geraete ab)
        env:
          # ${{ env.X }} sieht nur Variablen, die per $GITHUB_ENV gesetzt
          # wurden - ANDROID_SDK_ROOT kommt vom Runner-Image direkt in die
          # Shell, deshalb hier ueber $ANDROID_SDK_ROOT statt der env-Expression.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          pnpm tauri android build --apk --target aarch64

      - name: APK an das Release haengen
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk#Gutz.Now.Playing_${{ github.ref_name }}.apk \
            --clobber --repo ${{ github.repository }}
